name: Build & Lint

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  lint:
    name: Lint Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: codex/hpa-173-mission-board-impl
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format repository
        run: bun run format

      - name: Restore workflows and verify
        run: |
          git fetch origin main --depth=1
          git show FETCH_HEAD:.github/workflows/lint.yml > .github/workflows/lint.yml
          rm -f .github/workflows/format-review-fix.yml
          bun run format:check
          bun run lint

      - name: Commit formatting changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'style: format CodeRabbit review fixes (HPA-173)'
          git push origin HEAD:codex/hpa-173-mission-board-impl
