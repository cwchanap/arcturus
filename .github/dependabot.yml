version: 2

updates:
  # JavaScript / TypeScript dependencies (bun.lock committed at repo root)
  - package-ecosystem: 'bun'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
      timezone: 'America/Vancouver'
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore'
      include: 'scope'
    ignore:
      # vitest majors are pinned manually alongside astro's vite baseline;
      # vitest 5 is the tested combination with astro 7 (vite 8). Re-evaluate
      # on the next astro major rather than letting dependabot auto-bump vitest.
      - dependency-name: 'vitest'
        update-types: ['version-update:semver-major']
      # typescript majors are held until @astrojs/check and typescript-eslint
      # both support TS 7; remove this ignore once they do and typecheck,
      # lint, and tests all pass on the new major.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
    groups:
      # astro and @astrojs/* majors must land in one PR: the adapter declares
      # a peer range on astro, so separate major PRs can each fail install.
      astro-majors:
        patterns:
          - 'astro'
          - '@astrojs/*'
        update-types:
          - 'major'
      js-minor-and-patch:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'

  # GitHub Actions versions in .github/workflows
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '10:00'
      timezone: 'America/Vancouver'
    open-pull-requests-limit: 3
    commit-message:
      prefix: 'chore'
      include: 'scope'
    groups:
      github-actions:
        patterns:
          - '*'
