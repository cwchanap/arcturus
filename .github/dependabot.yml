version: 2

updates:
  # JavaScript / TypeScript dependencies (bun.lock committed at repo root)
  - package-ecosystem: 'bun'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
      timezone: 'America/Vancouver'
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore'
      include: 'scope'
    ignore:
      # vitest 5 (vite 7) breaks integration tests via astro's getViteConfig
      # ("assetsInclude" must be a string, astro passes a function); revisit
      # once astro ships a compatible vite baseline
      - dependency-name: 'vitest'
        update-types: ['version-update:semver-major']
    groups:
      js-minor-and-patch:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'

  # GitHub Actions versions in .github/workflows
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '10:00'
      timezone: 'America/Vancouver'
    open-pull-requests-limit: 3
    commit-message:
      prefix: 'chore'
      include: 'scope'
    groups:
      github-actions:
        patterns:
          - '*'
