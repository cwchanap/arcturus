name: One-shot legacy mission fix

on:
  push:
    branches:
      - codex/hpa-173-mission-board-impl

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: codex/hpa-173-mission-board-impl
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies with retry
        run: |
          for attempt in 1 2 3; do
            if bun install --frozen-lockfile; then
              exit 0
            fi
            echo "bun install failed on attempt ${attempt}; retrying..."
            rm -rf node_modules
            sleep $((attempt * 5))
          done
          exit 1

      - name: Patch legacy mission progress path
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/pages/api/chips/update.ts')
          text = path.read_text()

          old_import = "import { prepareMissionProgressStatements } from '../../../lib/missions';"
          new_import = "import { applyMissionProgress, prepareMissionProgressStatements } from '../../../lib/missions';"
          if old_import in text:
              text = text.replace(old_import, new_import, 1)
          elif new_import not in text:
              raise SystemExit('missions import was not in the expected state')

          old_block = """\t\t\t// Mission progress is now written in the same atomic batch as the
\t\t\t// chip_sync_receipt INSERT (see prepareMissionProgressStatements
\t\t\t// call above). The previous deferred waitUntil path is removed —
\t\t\t// it could silently drop progress on transient failure with no
\t\t\t// retry on syncId replay.
"""
          new_block = """\t\t\t// Legacy clients do not yet send syncId, so they cannot use the
\t\t\t// receipt-gated atomic path above. Preserve mission progress for
\t\t\t// those validated game events by awaiting the compatibility write
\t\t\t// before responding. Modern syncId callers remain receipt-backed.
\t\t\tif (
\t\t\t\tcanonicalSyncPayload === null &&
\t\t\t\tshouldRecordStats &&
\t\t\t\tisValidGameType(gameType)
\t\t\t) {
\t\t\t\ttry {
\t\t\t\t\tawait applyMissionProgress(dbBinding, userId, {
\t\t\t\t\t\tgameType,
\t\t\t\t\t\toutcome: outcome as 'win' | 'loss' | 'push',
\t\t\t\t\t\thandCount: resolvedHandCount,
\t\t\t\t\t\twinsIncrement: actualWinsIncrement,
\t\t\t\t\t\tlossesIncrement: actualLossesIncrement,
\t\t\t\t\t\tdelta: statsDeltaForTracking,
\t\t\t\t\t});
\t\t\t\t} catch (missionError) {
\t\t\t\t\tconsole.error('[MISSION_PROGRESS] Failed to update legacy sync:', missionError);
\t\t\t\t\twarnings.push('Mission progress tracking failed');
\t\t\t\t}
\t\t\t}

\t\t\t// Receipt-backed mission progress is written in the same atomic
\t\t\t// batch as chip_sync_receipt. The compatibility branch above is
\t\t\t// only for callers that have not migrated to syncId yet.
"""
          if old_block in text:
              text = text.replace(old_block, new_block, 1)
          elif new_block not in text:
              raise SystemExit('mission progress block was not in the expected state')

          path.write_text(text)
          PY

      - name: Format and verify focused tests
        run: |
          bunx prettier --write src/pages/api/chips/update.ts
          bun run format:check
          bun run lint
          bun test src/lib/chips-update.test.ts src/lib/chips-update-api.test.ts src/lib/missions/

      - name: Restore workflows and commit
        run: |
          cat > .github/workflows/lint.yml <<'YAML'
          name: Build & Lint

          on:
            pull_request:
              branches: [main]
            push:
              branches: [main]
            workflow_dispatch:

          jobs:
            lint:
              name: Lint Check
              runs-on: ubuntu-latest

              steps:
                - name: Checkout code
                  uses: actions/checkout@v4

                - name: Setup Bun
                  uses: oven-sh/setup-bun@v2
                  with:
                    bun-version: latest

                - name: Install dependencies
                  run: bun install --frozen-lockfile

                - name: Run ESLint
                  run: bun run lint

                - name: Check formatting with Prettier
                  run: bun run format:check

            build:
              name: Build Check
              runs-on: ubuntu-latest
              needs: [lint]

              steps:
                - name: Checkout code
                  uses: actions/checkout@v4

                - name: Setup Bun
                  uses: oven-sh/setup-bun@v2
                  with:
                    bun-version: latest

                - name: Install dependencies
                  run: bun install --frozen-lockfile

                - name: Build project
                  run: bun run build
                  env:
                    NODE_ENV: production

                - name: Upload build artifacts
                  uses: actions/upload-artifact@v4
                  with:
                    name: dist
                    path: dist/
                    retention-days: 7
          YAML
          rm .github/workflows/fix-legacy-mission.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'fix(missions): restore progress for legacy chip syncs (HPA-173)'
          git push origin HEAD:codex/hpa-173-mission-board-impl
