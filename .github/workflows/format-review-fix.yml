name: One-shot review formatting fix

on:
  push:
    branches:
      - codex/hpa-173-mission-board-impl

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: codex/hpa-173-mission-board-impl

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format repository and verify lint
        run: |
          bun run format
          bun run lint

      - name: Remove one-shot workflow and commit
        run: |
          rm .github/workflows/format-review-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'style: format CodeRabbit review fixes (HPA-173)'
          git push origin HEAD:codex/hpa-173-mission-board-impl
